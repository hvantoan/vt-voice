# git-cliff ~ configuration file for vt-voice
# Documentation: https://git-cliff.org/docs/configuration

[remote.github]
owner = "hvantoan"
repo = "vt-voice"

[changelog]
# Template rendered at the beginning of the changelog file.
header = """
# Changelog

All notable changes to **vt-voice** will be documented in this file.
This project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html) and [Conventional Commits](https://www.conventionalcommits.org/).

"""

# Template rendered for each release in the changelog.
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% macro print_commit(commit) -%}
    - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
        {% if commit.breaking %}[**BREAKING**] {% endif %}\
        {{ commit.message | upper_first }} \
        ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))\
{% endmacro -%}

{% if version %}\
    {% if previous.version %}\
        ## [{{ version }}]({{ self::remote_url() }}/compare/{{ previous.version }}..{{ version }}) — {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version }}]({{ self::remote_url() }}/releases/tag/{{ version }}) — {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [Unreleased]
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        {{ self::print_commit(commit=commit) }}
    {%- endfor %}
    {% for commit in commits %}
        {%- if not commit.scope -%}
            {{ self::print_commit(commit=commit) }}
        {% endif -%}
    {% endfor -%}
{% endfor %}
"""

# Template rendered at the end of the changelog file.
footer = """
<!-- generated by git-cliff -->
"""

# Trim leading/trailing whitespace from the rendered output.
trim = true

[git]
# Parse commits according to the Conventional Commits specification.
conventional_commits = true
# Do not drop unconventional commits; categorize them into Miscellaneous.
filter_unconventional = false
# Split multiline commits into individual items.
split_commits = false

# Regex-based preprocessing on commit messages before group matching.
commit_preprocessors = [
  # Convert PR numbers (#123) into markdown links.
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/hvantoan/vt-voice/pull/${1}))" },
]

# Classification of commits into changelog sections.
commit_parsers = [
  # Ignore release, merge, and automated commit messages
  { message = "^Merge", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(version\\)", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },

  # Functional categories
  { message = "^feat", group = "<!-- 0 -->✨ Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
  { message = "^style", group = "<!-- 3 -->🎨 UI & Styling" },
  { message = "^refactor", group = "<!-- 4 -->🚜 Refactor" },
  { message = "^doc", group = "<!-- 5 -->📚 Documentation" },
  { message = "^test", group = "<!-- 6 -->🧪 Testing" },
  { message = "^build", group = "<!-- 7 -->📦 Build" },
  { message = "^ci", group = "<!-- 8 -->⚙️ CI/CD" },
  { message = "^chore", group = "<!-- 9 -->🔧 Chores & Maintenance" },

  # Fallback for unconventional commits
  { message = ".*", group = "<!-- 99 -->📌 Other Changes" },
]

# Protect breaking commits from being filtered out.
protect_breaking_commits = true
filter_commits = false

# Tag pattern matching release tags (e.g. v0.1.0, v1.0.0).
tag_pattern = "v[0-9].*"
skip_tags = "beta|alpha"
ignore_tags = "rc"

# Topological sort and latest commits first.
topo_order = false
sort_commits = "newest"
