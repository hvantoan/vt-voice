<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="sonicGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark Squircle Background -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#09090b" stroke="#27272a" stroke-width="2"/>
  <!-- Microphone Outer Ring -->
  <rect x="46" y="24" width="36" height="52" rx="18" fill="none" stroke="url(#sonicGlow)" stroke-width="5" filter="url(#neonBlur)"/>
  <!-- Soundwave / Lightning Center Line -->
  <path d="M38 56 C38 70, 50 82, 64 82 C78 82, 90 70, 90 56 M64 82 L64 98 M48 98 L80 98 M58 36 L68 48 L60 52 L70 64" 
        fill="none" stroke="url(#sonicGlow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
